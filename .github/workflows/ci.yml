name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest
      - name: Build distributions
        run: python -m build
      - name: Install built wheel
        run: python -m pip install --force-reinstall --no-deps dist/tunarag_python-0.2.1-py3-none-any.whl
      - name: Import built wheel
        run: python -c "import tunarag; assert tunarag.__version__ == '0.2.1'"

  framework-compatibility:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install framework integrations
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,frameworks]"
      - name: Test real framework compatibility
        run: python -m pytest tests/test_framework_compatibility.py
