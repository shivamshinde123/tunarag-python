[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tunarag-python"
version = "0.3.0"
description = "Tune LangChain, LangGraph, and Google ADK RAG pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Shivam Shinde" }]
keywords = ["rag", "optimization", "evaluation", "llm", "retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/shivamshinde123/tunarag-python"
Issues = "https://github.com/shivamshinde123/tunarag-python/issues"
Changelog = "https://github.com/shivamshinde123/tunarag-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
ragas = [
    "ragas>=0.4,<0.5",
    "langchain-community>=0.3.31,<0.4",
]
mlflow = [
    "mlflow>=3,<4",
]
langchain = [
    "langchain>=1,<2",
    "numpy>=1.26,<3",
]
langgraph = [
    "langgraph>=1,<2",
]
google-adk = [
    "google-adk>=2,<3",
]
frameworks = [
    "langchain>=1,<2",
    "numpy>=1.26,<3",
    "langgraph>=1,<2",
    "google-adk>=2,<3",
]
dev = [
    "langchain-classic>=1,<2",
    "langchain-core>=1,<2",
    "langgraph>=1,<2",
    "numpy>=1.26,<3",
    "build>=1.2",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-include-markdown-plugin>=7,<8",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.27,<1",
]
live-test = [
    "ragas>=0.4,<0.5",
    "langchain-community>=0.3.31,<0.4",
    "mlflow>=3,<4",
    "langchain-classic>=1,<2",
    "langchain-openai>=1,<2",
    "python-dotenv>=1,<2",
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tunarag"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "frameworks: compatibility tests requiring optional framework packages",
    "live: opt-in real optional integration tests",
    "paid: opt-in OpenRouter requests requiring a restricted provider key",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["tunarag"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tomli"
ignore_missing_imports = true
